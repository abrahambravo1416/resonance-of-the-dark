name: Deploy gameplay archive

on:
  push:
    branches: [main]
    paths:
      - "telemetry/web/**"
      - ".github/workflows/deploy-gameplay-archive.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload archive site
        uses: actions/upload-pages-artifact@v3
        with:
          path: telemetry/web
      - name: Deploy archive site
        id: deployment
        uses: actions/deploy-pages@v4
